name = "prubsn-submission-service"
main = "src/worker.js"
compatibility_date = "2026-07-21"

# Non-secret configuration. Overridable per-environment below.
[vars]
AIRTABLE_BASE_ID = "appcA4lwc8KrLNxwM"
AIRTABLE_TABLE_ID = "tblmBQko8J7yOsBbv"
ALLOWED_ORIGIN = "*"

# AIRTABLE_PAT is a SECRET and must never be written here or committed
# anywhere. Set it with:
#   wrangler secret put AIRTABLE_PAT
# (production) and in .dev.vars (untracked, see .dev.vars.example) for
# local `wrangler dev`. See ../DEPLOYMENT.md.

# Optional rate limiting: uncomment after creating a KV namespace with
#   wrangler kv namespace create RATE_LIMIT_KV
# and pasting the id it prints below. Entirely optional - the Worker
# works without this binding, just without rate limiting.
# [[kv_namespaces]]
# binding = "RATE_LIMIT_KV"
# id = "<paste-the-namespace-id-here>"

# Phase 9 - required for POST /publish and GET /q/:id, /app/:id (the
# public client quotation platform). Without this binding, /publish and
# /q/*, /app/* return a clean "not configured" error - /submit (client
# application submissions) is entirely unaffected either way.
# Live in production since 2026-07-21 - see ../DEPLOYMENT.md's
# "Live production deployment" section for the real database details
# and the commands used to set this up on a fresh account/Worker.
[[d1_databases]]
binding = "QUOTATIONS_DB"
database_name = "prubsn-quotations"
database_id = "5541a426-c913-47fc-a018-55f7c9e3113a"

# --- Optional named environments (see DEPLOYMENT.md) ---
# `wrangler deploy --env staging` etc. Each environment gets its own
# secrets (`wrangler secret put AIRTABLE_PAT --env staging`) and, if
# desired, a different Airtable base/table for a safe testing sandbox.
#
# [env.staging]
# name = "prubsn-submission-service-staging"
# [env.staging.vars]
# AIRTABLE_BASE_ID = "appcA4lwc8KrLNxwM"
# AIRTABLE_TABLE_ID = "tblmBQko8J7yOsBbv"
# ALLOWED_ORIGIN = "*"
